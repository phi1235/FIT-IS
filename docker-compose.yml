services:
  # Keycloak - Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:18.0.2
    command: [ "start-dev", "--http-port=8080" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes
      - ./spring-boot-keycloak/target/keycloak-integration-1.0.0.jar:/opt/keycloak/providers/keycloak-integration.jar
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/realms/master" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    cpus: 1.0
    mem_limit: 768m

  # Spring API - Main API Gateway
  spring-api:
    build:
      context: ./spring-boot-keycloak/gateway-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      JASPER_TEMPLATE_PATH: /app/jasper-templates
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_REDIS_HOST: redis
      REDIS_HOST: redis
      # Service URLs for gateway routing
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8083
      TICKET_SERVICE_URL: http://ticket-service:8084
      REPORT_SERVICE_URL: http://report-service:8087
      AUDIT_SERVICE_URL: http://audit-service:8086
      WORKFLOW_SERVICE_URL: http://workflow-service:8085
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    volumes:
      - /home/nguyen-phi/JaspersoftWorkspace/MyReports:/app/jasper-templates:ro
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    cpus: 0.5
    mem_limit: 512m
    restart: on-failure:3

  # Redis - Cache Server
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 0.25
    mem_limit: 192m

  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m

  # pgAdmin - PostgreSQL Web Admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m

  # Auth Service
  auth-service:
    build:
      context: ./spring-boot-keycloak/auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_REDIS_HOST: redis
      REDIS_HOST: redis
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "smtp.gmail.com:74.125.200.108"
    cpus: 0.5
    mem_limit: 512m
    restart: on-failure:3

  # User Service
  user-service:
    build:
      context: ./spring-boot-keycloak/user-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_REDIS_HOST: redis
      REDIS_HOST: redis
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    cpus: 0.5
    mem_limit: 512m
    restart: on-failure:3

  # Ticket Service
  ticket-service:
    build:
      context: ./spring-boot-keycloak/ticket-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_REDIS_HOST: redis
      REDIS_HOST: redis
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    cpus: 0.5
    mem_limit: 512m
    restart: on-failure:3

  # Workflow Service
  workflow-service:
    build:
      context: ./spring-boot-keycloak/workflow-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
