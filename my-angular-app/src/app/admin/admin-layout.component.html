<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="logo-box">FIS</div>
      <span>FIS Portal</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a *appPermission="'TICKET_VIEW'" routerLink="/admin/tickets" routerLinkActive="active" class="nav-item">
        <i class="bi bi-ticket-perforated"></i> Tickets
      </a>
      <a *appPermission="'USER_VIEW'" routerLink="/admin/users" routerLinkActive="active" class="nav-item">
        <i class="bi bi-people"></i> Users
      </a>
      <a *appPermission="'EMAIL_TEMPLATE_VIEW'" routerLink="/admin/email-templates" routerLinkActive="active" class="nav-item">
        <i class="bi bi-envelope-paper"></i> Email Templates
      </a>
      <a *appPermission="'ROLE_VIEW'" routerLink="/admin/roles" routerLinkActive="active" class="nav-item">
        <i class="bi bi-shield-lock"></i> Role Management
      </a>
      <a *appPermission="'AUDIT_VIEW'" routerLink="/admin/audit-logs" routerLinkActive="active" class="nav-item">
        <i class="bi bi-shield-check"></i> Audit Logs
      </a>
      <a *appPermission="'AUDIT_VIEW'" routerLink="/admin/notifications" routerLinkActive="active" class="nav-item">
        <i class="bi bi-megaphone"></i> Notifications
      </a>
      <a *appPermission="'WORKFLOW_VIEW'" routerLink="/admin/workflow" routerLinkActive="active" class="nav-item">
        <i class="bi bi-diagram-3"></i> Workflows
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info-wrapper">
        <button class="user-info" (click)="toggleUserDropdown()">
          <div class="u-avatar">{{ getDisplayName().charAt(0).toUpperCase() }}</div>
          <span class="u-name">{{ getDisplayName() }}</span>
          <i class="bi u-chevron" [class.bi-chevron-up]="showUserDropdown" [class.bi-chevron-down]="!showUserDropdown"></i>
        </button>
        <div class="user-dropdown-menu" *ngIf="showUserDropdown">
          <a routerLink="/profile" class="user-dropdown-item" (click)="showUserDropdown = false">
            <i class="bi bi-person-circle"></i> Hồ sơ cá nhân
          </a>
          <a routerLink="/settings" class="user-dropdown-item" (click)="showUserDropdown = false">
            <i class="bi bi-gear"></i> Cài đặt
          </a>
        </div>
      </div>
      <button class="change-pw-btn" (click)="openChangePassword()">Đổi Mật Khẩu</button>
      <button class="logout-btn" (click)="logout()">Đăng Xuất</button>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="admin-main-area">
    <header class="admin-top-bar">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <ng-container *ngFor="let crumb of breadcrumbs">
          <a *ngIf="!crumb.isLast" [routerLink]="crumb.url" class="bc-link">{{ crumb.label }}</a>
          <span *ngIf="crumb.isLast" class="bc-current">{{ crumb.label }}</span>
          <i *ngIf="!crumb.isLast" class="bi bi-chevron-right bc-sep"></i>
        </ng-container>
      </nav>
      <div class="top-bar-actions"></div>
    </header>

    <main class="admin-content-scroll">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
<app-change-password-modal></app-change-password-modal>
